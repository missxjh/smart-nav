<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO 优化 -->
    <meta name="description" content="科技共享-智能多功能响应式导航。提供高效的搜索、云端自定义网址管理、动态天气与专属壁纸等个性化功能。">
    <meta name="keywords" content="网址导航, 科技共享, 开发者导航, 智能导航, 响应式网站, 云端同步">
    
    <title id="page-title">科技共享-智能多功能响应式导航</title>
    
    <!-- 性能优化：DNS 预解析与预连接 -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    
    <!-- Google AdSense 基础脚本 -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 日间模式 (Light) 基础样式 */
        body.theme-light {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: #0f172a;
        }
        body.theme-light .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        body.theme-light .glass-input {
            background: rgba(0, 0, 0, 0.04);
            color: #000;
        }
        body.theme-light input::placeholder { color: #94a3b8; }
        body.theme-light #engine-menu { background: #ffffff; border-color: #e2e8f0; }
        body.theme-light #engine-menu button { color: #334155; }
        body.theme-light #engine-menu button:hover { background: rgba(79, 70, 229, 0.08); }

        /* 夜间模式 (Dark) 基础样式 */
        body.theme-dark {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            color: #f8fafc;
        }
        body.theme-dark .glass-card {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        body.theme-dark .glass-input {
            background: rgba(255, 255, 255, 0.07);
        }

        /* 自定义壁纸激活状态的遮罩 */
        body.has-custom-bg::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(2px);
            z-index: -1;
        }

        /* 全局过渡动画与拖拽交互支持 */
        body, .glass-card, .glass-input, #custom-links-container {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .dragging {
            opacity: 0.4;
            transform: scale(0.98);
            border: 2px dashed #6366f1 !important;
        }

        /* 管理员权限控制类：默认非管理员隐藏编辑元素 */
        body:not(.is-admin) .admin-only {
            display: none !important;
        }
    </style>
</head>
<body class="theme-dark font-sans antialiased selection:bg-indigo-500 selection:text-white min-h-screen flex flex-col justify-between" onclick="closeEngineMenu()">

    <!-- 个性化设置浮窗 -->
    <div class="fixed top-5 right-5 z-[150]">
        <button aria-label="个性化设置" onclick="toggleThemeMenu(event)" class="w-10 h-10 rounded-xl glass-card flex items-center justify-center text-slate-400 hover:text-indigo-500 hover:scale-105 active:scale-95 transition-all shadow-lg cursor-pointer" title="个性化设置">
            <i id="theme-icon" class="fas fa-palette text-sm"></i>
        </button>
        <div id="theme-panel" class="absolute right-0 top-full mt-2 w-60 bg-slate-900/95 border border-slate-700/80 rounded-2xl shadow-2xl hidden backdrop-blur-md p-4 space-y-3 z-[160]" onclick="event.stopPropagation()">
            <div class="text-[11px] font-bold text-slate-400 px-1 mb-1.5" data-i18n="langTitle">语言 / Language</div>
            <div class="flex gap-2 mb-3 border-b border-slate-800 pb-3">
                <button onclick="setLanguage('zh')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer">中文</button>
                <button onclick="setLanguage('en')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer">English</button>
            </div>

            <div class="text-[11px] font-bold text-slate-400 px-1" data-i18n="themeTitle">基础色彩模式 (本地偏好)</div>
            <div class="flex gap-2">
                <button onclick="setBaseTheme('theme-light')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer flex items-center justify-center gap-1"><i class="fas fa-sun text-amber-500"></i> <span data-i18n="themeLight">日间</span></button>
                <button onclick="setBaseTheme('theme-dark')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer flex items-center justify-center gap-1"><i class="fas fa-moon text-indigo-400"></i> <span data-i18n="themeDark">夜间</span></button>
            </div>
            
            <!-- 云端管理员功能: 壁纸修改 -->
            <div class="admin-only space-y-1.5 px-1 border-t border-slate-800 pt-3 mt-1">
                <div class="flex justify-between items-center">
                    <label class="text-[11px] text-slate-400 font-bold" data-i18n="bgTitle">自定义背景 (全站同步)</label>
                    <button onclick="clearCustomBg()" id="clear-bg-btn" class="text-[10px] text-red-400 hover:underline hidden" data-i18n="clearBg">清除壁纸</button>
                </div>
                <div class="flex gap-1.5">
                    <input type="text" id="custom-bg-input" data-i18n-placeholder="bgInputPlace" placeholder="输入图片网址 https://..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
                    <button onclick="applyCustomBg()" class="bg-indigo-600 text-white px-2 py-1 rounded-lg text-xs hover:bg-indigo-500 cursor-pointer shrink-0" data-i18n="applyBtn">应用</button>
                </div>
            </div>
            
            <!-- 云端管理员功能: 密码修改 -->
            <div class="admin-only space-y-1.5 px-1 border-t border-slate-800 pt-3 mt-1">
                <label class="text-[11px] text-slate-400 font-bold" data-i18n="pwdTitle">修改管理员密码 (全站同步)</label>
                <div class="flex gap-1.5">
                    <input type="password" id="custom-pwd-input" data-i18n-placeholder="pwdInputPlace" placeholder="输入新密码" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                    <button onclick="updateAdminPwd()" class="bg-emerald-600 text-white px-2 py-1 rounded-lg text-xs hover:bg-emerald-500 cursor-pointer shrink-0" data-i18n="saveBtn">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 主体区域 -->
    <main class="container mx-auto px-4 pt-12 pb-8 max-w-4xl flex-1 flex flex-col justify-center">
        
        <!-- 动态时间/天气 -->
        <div class="text-center mb-8">
            <h1 id="clock" class="text-5xl md:text-6xl font-extrabold tracking-tight mb-2 bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400">
                11:00:39
            </h1>
            <div class="flex items-center justify-center gap-3 text-xs md:text-sm text-slate-400 font-medium">
                <span><i class="fas fa-sun text-amber-400 mr-1"></i> 早上好，专注当下，今天也要元气满满</span>
                <span>|</span>
                <span><i class="fas fa-cloud text-sky-400 mr-1"></i> 风调雨顺 · 晴</span>
            </div>
        </div>

        <!-- 聚合搜索 -->
        <div class="relative max-w-2xl mx-auto w-full mb-8">
            <form id="search-form" onsubmit="handleSearch(event)" class="relative flex items-center">
                <button type="button" onclick="toggleEngineMenu(event)" class="absolute left-3 flex items-center gap-1.5 text-slate-400 hover:text-indigo-400 text-sm font-medium z-10 py-1.5 px-2 rounded-lg hover:bg-slate-800/50 transition-colors">
                    <i id="current-engine-icon" class="fab fa-google text-indigo-400"></i>
                    <i class="fas fa-chevron-down text-[10px] opacity-60"></i>
                </button>

                <input type="text" id="search-input" autocomplete="off" placeholder="在 Google 中搜索..." class="w-full glass-input pl-16 pr-12 py-3.5 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 shadow-inner transition-all">

                <button type="submit" class="absolute right-3 text-slate-400 hover:text-indigo-500 p-2 text-sm transition-colors cursor-pointer">
                    <i class="fas fa-search"></i>
                </button>
            </form>

            <div id="engine-menu" class="absolute left-0 top-full mt-2 w-40 glass-card rounded-xl shadow-xl hidden z-50 overflow-hidden py-1 border border-slate-700/50">
                <button type="button" onclick="selectEngine('google')" class="w-full px-4 py-2 text-left text-xs flex items-center gap-2.5 hover:bg-indigo-600/10 transition-colors">
                    <i class="fab fa-google text-indigo-400 w-4"></i> Google
                </button>
                <button type="button" onclick="selectEngine('baidu')" class="w-full px-4 py-2 text-left text-xs flex items-center gap-2.5 hover:bg-indigo-600/10 transition-colors">
                    <i class="fas fa-paw text-blue-500 w-4"></i> 百度
                </button>
                <button type="button" onclick="selectEngine('bing')" class="w-full px-4 py-2 text-left text-xs flex items-center gap-2.5 hover:bg-indigo-600/10 transition-colors">
                    <i class="fab fa-microsoft text-emerald-400 w-4"></i> Bing
                </button>
            </div>
        </div>

        <!-- 云端/后台驱动的自定义分类区域容器（已全面剔除原默认板块） -->
        <div id="custom-links-container" class="space-y-6"></div>

        <!-- 管理员独享：创建云端区域卡片按钮 -->
        <div class="glass-card rounded-2xl p-6 border border-dashed border-slate-700/60 flex flex-col items-center justify-center text-slate-500 hover:border-indigo-500/50 transition-all cursor-pointer group admin-only mt-4" onclick="addCustomArea()">
            <i class="fas fa-plus text-xl mb-1 group-hover:scale-110 group-hover:text-indigo-400 transition-all"></i>
            <span class="text-xs font-medium">添加自定义云端区域</span>
        </div>

        <!-- 友情链接区域 -->
        <div class="glass-card rounded-2xl p-5 mt-6">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2 text-xs font-bold text-slate-400">
                    <i class="fas fa-link text-emerald-400"></i>
                    <span>友情链接</span>
                </div>
                <button onclick="addFriendLink()" class="admin-only text-[10px] bg-indigo-600 text-white px-2 py-0.5 rounded hover:bg-indigo-500 cursor-pointer">添加友链</button>
            </div>
            <div id="friend-links-list" class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
                <a href="#" target="_blank" class="p-2.5 rounded-xl bg-slate-800/40 hover:bg-indigo-600/20 text-slate-300 hover:text-indigo-400 transition-all text-center border border-slate-800 truncate">IT头条博客</a>
                <a href="#" target="_blank" class="p-2.5 rounded-xl bg-slate-800/40 hover:bg-indigo-600/20 text-slate-300 hover:text-indigo-400 transition-all text-center border border-slate-800 truncate">科技共享导航</a>
            </div>
        </div>

    </main>

    <!-- 页脚版权信息 -->
    <footer class="text-center py-6 text-[11px] text-slate-500">
        <p>© 2026 科技共享-智能多功能导航 · Powered by Cloudflare 
            <span id="admin-badge" class="bg-indigo-500/10 text-indigo-400 px-1.5 py-0.5 rounded ml-1 border border-indigo-500/20 hidden">管理员已登录</span>
        </p>
    </footer>

    <!-- 项目完整核心 JS 交互 -->
    <script>
        const engines = {
            google: { name: 'Google', icon: 'fab fa-google text-indigo-400', url: 'https://www.google.com/search?q=', placeholder: '在 Google 中搜索...' },
            baidu: { name: '百度', icon: 'fas fa-paw text-blue-500', url: 'https://www.baidu.com/s?wd=', placeholder: '在 百度 中搜索...' },
            bing: { name: 'Bing', icon: 'fab fa-microsoft text-emerald-400', url: 'https://cn.bing.com/search?q=', placeholder: '在 Bing 中搜索...' }
        };
        let currentEngine = 'google';

        // 判定 Worker 后台 /admin 权限
        const isAdmin = window.location.pathname.endsWith('/admin') || window.location.pathname.endsWith('/admin/');
        if (isAdmin) {
            document.body.classList.add('is-admin');
            const badge = document.getElementById('admin-badge');
            if (badge) badge.classList.remove('hidden');
        }

        // 时钟刷新
        function updateClock() {
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            const clockEl = document.getElementById('clock');
            if (clockEl) clockEl.innerText = timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 基础交互函数
        function toggleThemeMenu(e) { e.stopPropagation(); document.getElementById('theme-panel').classList.toggle('hidden'); }
        function toggleEngineMenu(e) { e.stopPropagation(); document.getElementById('engine-menu').classList.toggle('hidden'); }
        function closeEngineMenu() {
            document.getElementById('engine-menu')?.classList.add('hidden');
            document.getElementById('theme-panel')?.classList.add('hidden');
        }

        function selectEngine(key) {
            currentEngine = key;
            const engine = engines[key];
            document.getElementById('current-engine-icon').className = engine.icon;
            document.getElementById('search-input').placeholder = engine.placeholder;
            closeEngineMenu();
        }

        function handleSearch(e) {
            e.preventDefault();
            const query = document.getElementById('search-input').value.trim();
            if (query) window.open(engines[currentEngine].url + encodeURIComponent(query), '_blank');
        }

        function setBaseTheme(themeName) {
            document.body.classList.remove('theme-light', 'theme-dark');
            document.body.classList.add(themeName);
            localStorage.setItem('pref-theme', themeName);
        }

        function setLanguage(lang) {
            localStorage.setItem('pref-lang', lang);
            alert(lang === 'zh' ? '已切换至中文' : 'Switched to English');
        }

        // 适配 nav-item 后台的云端 API 通信逻辑
        async function apiSaveData(payload) {
            if (!isAdmin) return;
            try {
                const res = await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    alert('保存成功！已同步至全站云端 KV。');
                }
            } catch (err) {
                console.log('数据已更新到前端页面。');
            }
        }

        // 添加分类区域
        function addCustomArea() {
            const areaName = prompt('请输入新区域/分类名称：');
            if (!areaName) return;

            const container = document.getElementById('custom-links-container');
            const card = document.createElement('div');
            card.className = 'glass-card rounded-2xl p-5 relative mb-4';
            card.innerHTML = `
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2 text-sm font-bold text-slate-200">
                        <i class="fas fa-folder-open text-indigo-400"></i>
                        <span>${areaName}</span>
                    </div>
                    <button onclick="addLinkToArea(this)" class="admin-only text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-2.5 py-1 rounded-lg">添加网址</button>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 link-grid"></div>
            `;
            container.appendChild(card);
            apiSaveData({ type: 'add_area', name: areaName });
        }

        // 添加网址卡片
        function addLinkToArea(btn) {
            const name = prompt('请输入网站名称：');
            if (!name) return;
            let url = prompt('请输入网址 (例如：https://example.com)：');
            if (!url) return;
            if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;

            const grid = btn.closest('.glass-card').querySelector('.link-grid');
            let domain = '';
            try { domain = new URL(url).hostname; } catch(e) {}

            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.className = 'p-3 rounded-xl bg-slate-800/40 hover:bg-slate-800/80 text-slate-200 transition-all border border-slate-800 flex items-center gap-2 text-xs font-medium truncate group';
            a.innerHTML = `
                <img src="https://api.iowen.cn/api/favicon.php?url=${domain}" onerror="this.onerror=null;this.src='https://fontawesome.com/favicon.ico'" class="w-4 h-4 rounded-full opacity-80 shrink-0">
                <span class="truncate group-hover:text-indigo-400">${name}</span>
            `;
            grid.appendChild(a);
            apiSaveData({ type: 'add_link', name, url });
        }

        function addFriendLink() {
            const name = prompt('请输入友情链接名称：');
            if (!name) return;
            let url = prompt('请输入网址：');
            if (!url) return;

            const list = document.getElementById('friend-links-list');
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.className = 'p-2.5 rounded-xl bg-slate-800/40 hover:bg-indigo-600/20 text-slate-300 hover:text-indigo-400 transition-all text-center border border-slate-800 truncate';
            a.innerText = name;
            list.appendChild(a);
            apiSaveData({ type: 'add_friend_link', name, url });
        }

        // 壁纸与密码管理
        function applyCustomBg() {
            const url = document.getElementById('custom-bg-input').value.trim();
            if (url) {
                document.body.style.backgroundImage = `url('${url}')`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                document.body.style.backgroundAttachment = 'fixed';
                document.body.classList.add('has-custom-bg');
                document.getElementById('clear-bg-btn').classList.remove('hidden');
                localStorage.setItem('custom-bg-url', url);
                apiSaveData({ type: 'set_bg', url });
            }
        }

        function clearCustomBg() {
            document.body.style.backgroundImage = '';
            document.body.classList.remove('has-custom-bg');
            document.getElementById('clear-bg-btn').classList.add('hidden');
            document.getElementById('custom-bg-input').value = '';
            localStorage.removeItem('custom-bg-url');
            apiSaveData({ type: 'set_bg', url: '' });
        }

        function updateAdminPwd() {
            const pwd = document.getElementById('custom-pwd-input').value.trim();
            if (pwd) {
                apiSaveData({ type: 'set_pwd', pwd });
                alert('新密码保存成功，已同步至云端！');
                document.getElementById('custom-pwd-input').value = '';
            }
        }

        // 页面加裁配置
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('pref-theme');
            if (savedTheme) setBaseTheme(savedTheme);

            const savedBg = localStorage.getItem('custom-bg-url');
            if (savedBg) {
                document.getElementById('custom-bg-input').value = savedBg;
                applyCustomBg();
            }
        });
    </script>
</body>
</html>
